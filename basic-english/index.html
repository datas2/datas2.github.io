<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Basic English Flashcards</title>

		<!-- PWA -->
		<link rel="manifest" href="manifest.json" />
		<meta name="theme-color" content="#1f3a5f" />
		<link rel="icon" type="image/png" href="icons/icon-32.png" />

		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link
			rel="apple-touch-icon"
			type="image/png"
			href="icons/icon-180.png"
		/>

		<!-- Bootstrap CSS -->
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
			integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
			crossorigin="anonymous"
		/>

		<!-- Custom styles -->
		<link rel="stylesheet" href="style.css" />
	</head>
	<body class="bg-light d-flex flex-column min-vh-100">
		<header class="py-3 mb-3 border-bottom bg-white shadow-sm">
			<div class="container">
				<h1 class="h3 mb-0 text-center">Basic English – 850 Words</h1>
			</div>
		</header>

		<main
			class="flex-grow-1 d-flex align-items-center justify-content-center"
		>
			<div
				class="container d-flex flex-column align-items-center justify-content-center"
			>
				<section
					id="flashcard"
					class="card-container w-100"
					style="max-width: 480px"
				>
					<div class="card-inner">
						<!-- FRONT: only the word + show meaning -->
						<div class="card-face card-front card shadow-sm">
							<div class="card-body d-flex flex-column">
								<div class="mb-3 text-center">
									<div
										class="fs-2 fw-semibold mb-2"
										id="word"
									>
										Loading...
									</div>
								</div>
								<div
									class="d-flex justify-content-center mt-auto"
								>
									<button
										id="btn-show-meaning"
										type="button"
										class="btn btn-primary px-4"
									>
										Show meaning
									</button>
								</div>
							</div>
						</div>

						<!-- BACK: word + meaning + known/unknown -->
						<div class="card-face card-back card shadow-sm">
							<div class="card-body d-flex flex-column">
								<div class="mb-3 text-center">
									<div
										class="fs-2 fw-semibold mb-2"
										id="word-back"
									>
										Loading...
									</div>
									<div
										class="fs-5 text-muted"
										id="meaning"
									></div>
								</div>

								<div
									class="d-flex gap-2 justify-content-between mt-auto"
								>
									<button
										id="btn-known"
										type="button"
										class="btn btn-success flex-fill"
									>
										I knew it
									</button>
									<button
										id="btn-unknown"
										type="button"
										class="btn btn-outline-danger flex-fill"
									>
										I didn’t know
									</button>
								</div>
							</div>
						</div>
					</div>
				</section>

				<section class="mt-3 w-100" style="max-width: 480px">
					<div class="card border-0 bg-transparent">
						<div class="card-body py-1 px-0">
							<p
								id="progress-main"
								class="mb-1 text-center text-muted small"
							>
								Mastered: 0% • Seen: 0/0 • Accuracy: 0% (0✓ /
								0✗)
							</p>
							<p
								id="progress-srs"
								class="mb-0 text-center text-muted small"
							>
								Levels: Beginner 0 • Intermediate 0 • Advanced 0
								• Hard: 0
							</p>
						</div>
					</div>
				</section>

				<section class="mt-3 w-100" style="max-width: 480px">
					<div class="card border-0 bg-transparent">
						<div class="card-body py-1 px-0">
							<p class="mb-1 text-center text-muted small">
								Study activity (last 30 days)
							</p>
							<div
								id="daily-graph"
								class="d-flex flex-wrap gap-1 justify-content-center"
							></div>
						</div>
					</div>
				</section>

				<section
					class="mt-2 w-100 d-flex justify-content-center"
					style="max-width: 480px"
				>
					<button
						id="btn-reset"
						type="button"
						class="btn btn-sm btn-outline-secondary"
					>
						Reset progress
					</button>
				</section>
			</div>
		</main>

		<footer class="py-3 mt-4 bg-white border-top">
			<div class="container">
				<p class="mb-0 text-center text-muted small">
					Practice Ogden’s 850 Basic English words anywhere, even
					offline.
				</p>
			</div>
		</footer>

		<script src="app.js"></script>

		<script
			data-name="BMC-Widget"
			data-cfasync="false"
			src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js"
			data-id="augsmachado"
			data-description="Support me on Buy me a coffee!"
			data-message=""
			data-color="#5F7FFF"
			data-position="Right"
			data-x_margin="18"
			data-y_margin="18"
		></script>
	</body>
</html>
